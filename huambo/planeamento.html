<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeamento HSE - HMRH Huambo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Orbitron:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080d;
      --panel: #0f121a;
      --text: #f7fbff;
      --muted: #7b86a3;
      --line: rgba(255,255,255,.1);
      --blue: #1e90ff;
    }

    body.theme-light {
      --bg: #eef3f8;
      --panel: #ffffff;
      --text: #0b1522;
      --muted: #64748b;
      --line: rgba(16,41,70,.14);
      --blue: #0b72d9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .page {
      width: min(1200px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--blue);
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .back:hover { text-decoration: underline; }

    .mode-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 4px;
      gap: 4px;
      background: rgba(255,255,255,.05);
    }

    .mode-btn {
      border: 0;
      border-radius: 9px;
      padding: 7px 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .05em;
      font-family: "JetBrains Mono", monospace;
    }

    .mode-btn.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(30,144,255,.75), rgba(0,229,255,.45));
    }

    #planeamento-hse {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
    }
  </style>
</head>
<body class="theme-light">
  <main class="page">
    <div class="topbar">
      <a class="back" href="./">&larr; HSE Dashboard</a>
      <div class="mode-toggle" aria-label="Theme mode">
        <button class="mode-btn" id="darkModeBtn" type="button" onclick="setTheme('dark')">Dark</button>
        <button class="mode-btn active" id="lightModeBtn" type="button" onclick="setTheme('light')">Normal</button>
      </div>
    </div>

    <div id="planeamento-hse"></div>
  </main>

  <script>
    function setTheme(mode) {
      const theme = mode === 'light' ? 'light' : 'dark';
      document.body.classList.toggle('theme-light', theme === 'light');
      document.body.classList.toggle('theme-dark', theme === 'dark');
      document.getElementById('darkModeBtn')?.classList.toggle('active', theme === 'dark');
      document.getElementById('lightModeBtn')?.classList.toggle('active', theme === 'light');
      localStorage.setItem('hse-theme', theme);
    }
    setTheme(localStorage.getItem('hse-theme') || 'dark');
  </script>
  <script src="./planeamento-hse.js"></script>
</body></html>
